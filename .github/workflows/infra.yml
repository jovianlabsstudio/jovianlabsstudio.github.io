name: Domain setup (DNS)

on:
  workflow_dispatch:
    inputs:
      pages:
        description: "GitHub Pages records (yes/no)"
        required: false
        default: "yes"
      resend:
        description: "Resend email records (yes/no)"
        required: false
        default: "no"
      txt:
        description: "Extra TXT record at the root (e.g. Search Console verification)"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  dns:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Configure DNS
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ZONE_ID: ${{ secrets.CF_ZONE_ID }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          PAGES: ${{ github.event.inputs.pages }}
          RESEND: ${{ github.event.inputs.resend }}
          TXT: ${{ github.event.inputs.txt }}
        run: |
          args=""
          [ "$PAGES" = "yes" ] && args="$args --pages"
          [ "$RESEND" = "yes" ] && args="$args --resend"
          if [ -n "$TXT" ]; then python tools/infra/dns_setup.py $args --txt "$TXT"; else python tools/infra/dns_setup.py $args; fi
