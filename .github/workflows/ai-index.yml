name: AI Recommendation Index (weekly)

on:
  schedule:
    - cron: "17 6 * * 1"        # chaque lundi 06:17 UTC
  workflow_dispatch:
    inputs:
      only:
        description: "Limiter à quelques pages (ex. plumbers/austin-tx), vide = tout"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: ai-index
  cancel-in-progress: false

jobs:
  measure:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check secrets
        id: keys
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PERPLEXITY_API_KEY: ${{ secrets.PERPLEXITY_API_KEY }}
        run: |
          # On démarre avec les clés disponibles : Gemini seul suffit, Perplexity s'ajoute quand sa clé existe.
          if [ -z "$GEMINI_API_KEY" ] && [ -z "$PERPLEXITY_API_KEY" ]; then
            echo "No API key set yet: skipping the measurement." >> "$GITHUB_STEP_SUMMARY"
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Measure (AI answers)
        if: steps.keys.outputs.ok == 'true'
        working-directory: tools/ai-index
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PERPLEXITY_API_KEY: ${{ secrets.PERPLEXITY_API_KEY }}
          ONLY: ${{ github.event.inputs.only }}
        run: |
          if [ -n "$ONLY" ]; then python -m aiindex run --only $ONLY; else python -m aiindex run; fi
      - name: Build pages
        if: steps.keys.outputs.ok == 'true'
        working-directory: tools/ai-index
        run: python -m aiindex render --out ../..
      - name: Commit
        if: steps.keys.outputs.ok == 'true'
        run: |
          git config user.name "Jovian Labs"
          git config user.email "jovianlabsstudio@gmail.com"
          git add tools/ai-index/data ai-index
          if git diff --cached --quiet; then echo "No change"; exit 0; fi
          git commit -m "AI Recommendation Index: weekly update $(date -u +%G-W%V)"
          git pull --rebase
          git push
